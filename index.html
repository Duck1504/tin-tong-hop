<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản tin tổng hợp</title>
<meta name="description" content="Tin mới nhất trong 24 giờ từ VnExpress, Tuổi Trẻ, Thanh Niên và Dân Trí, cập nhật tự động.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --ink: #1c1b19;
    --muted: #6b675f;
    --line: #e4dfd4;
    --accent: #b3261e;
    --chip: #efebe2;
    --chip-on: #1c1b19;
    --chip-on-ink: #ffffff;
    --s-vnexpress: #9f224e;
    --s-tuoitre: #ed1c24;
    --s-thanhnien: #0b6db7;
    --s-dantri: #2f8a3e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1d1c1a;
      --ink: #ece9e2;
      --muted: #a29d93;
      --line: #2f2d29;
      --accent: #ff6b5e;
      --chip: #2a2825;
      --chip-on: #ece9e2;
      --chip-on-ink: #141413;
      --s-vnexpress: #e0638f;
      --s-tuoitre: #ff6b6b;
      --s-thanhnien: #5fb0ef;
      --s-dantri: #6cc77a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  header.masthead {
    border-bottom: 3px double var(--line);
    padding: 28px 0 18px;
    text-align: center;
  }
  .masthead .date { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .masthead h1 {
    font: 700 clamp(30px, 7vw, 48px)/1.1 "Noto Serif", Georgia, serif;
    margin: 6px 0 8px;
    letter-spacing: -.01em;
  }
  .masthead h1 span { color: var(--accent); }
  .masthead .updated { font-size: 14px; color: var(--muted); }

  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 14px 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .search {
    width: 100%;
    font: inherit;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font-family: inherit; font-weight: 500; font-size: 14px; line-height: 1;
    padding: 8px 12px;
    border-radius: 999px;
    border: 0;
    background: var(--chip);
    color: var(--ink);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .chip .n { opacity: .6; margin-left: 4px; font-weight: 400; }

  main { padding: 6px 0 40px; }
  .status { text-align: center; color: var(--muted); padding: 48px 0; }

  article.item {
    display: grid;
    grid-template-columns: 1fr 132px;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  article.item.noimg { grid-template-columns: 1fr; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .src { font-weight: 600; }
  .src.vnexpress { color: var(--s-vnexpress); }
  .src.tuoitre { color: var(--s-tuoitre); }
  .src.thanhnien { color: var(--s-thanhnien); }
  .src.dantri { color: var(--s-dantri); }
  .item h2 {
    font: 600 19px/1.35 "Noto Serif", Georgia, serif;
    margin: 4px 0 6px;
  }
  .item h2 a { color: inherit; text-decoration: none; }
  .item h2 a:hover { color: var(--accent); }
  .item p { margin: 0; color: var(--muted); font-size: 15px; }
  .thumb {
    width: 132px; aspect-ratio: 4 / 3;
    border-radius: 8px; overflow: hidden;
    background: var(--chip);
    align-self: start;
    margin-top: 4px;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 560px) {
    article.item { grid-template-columns: 1fr 96px; gap: 12px; }
    .thumb { width: 96px; }
    .item h2 { font-size: 17px; }
    .item p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 0 32px; }
  .more {
    display: block; margin: 20px auto 0;
    font-family: inherit; font-weight: 500; font-size: 15px; line-height: 1;
    padding: 12px 20px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="date" id="today"></div>
      <h1>Bản tin <span>tổng hợp</span></h1>
      <div class="updated" id="updated">Đang tải…</div>
    </header>

    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Tìm theo từ khóa, ví dụ: tuyển sinh, bóng đá…" autocomplete="off">
      <div class="chips" id="chips" role="toolbar" aria-label="Lọc theo báo"></div>
    </div>

    <main id="list" aria-live="polite">
      <div class="status">Đang tải tin…</div>
    </main>

    <footer>Tin được lấy tự động từ RSS của các báo. Bấm vào tiêu đề để đọc bài gốc.</footer>
  </div>

<script>
(function () {
  var PAGE = 30;
  var state = { all: [], source: 'Tất cả', q: '', shown: PAGE };
  var $ = function (id) { return document.getElementById(id); };

  var days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  var now = new Date();
  $('today').textContent = days[now.getDay()] + ', ngày ' + now.getDate() + ' tháng ' + (now.getMonth() + 1) + ' năm ' + now.getFullYear();

  function fold(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  }
  function slug(s) { return fold(s).replace(/[^a-z0-9]/g, ''); }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(m)) return '';
    if (m < 1) return 'vừa xong';
    if (m < 60) return m + ' phút trước';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' giờ trước';
    return Math.floor(h / 24) + ' ngày trước';
  }
  function hhmm(iso) {
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }

  function filtered() {
    var q = fold(state.q.trim());
    return state.all.filter(function (a) {
      if (state.source !== 'Tất cả' && a.source !== state.source) return false;
      if (!q) return true;
      return a._f.indexOf(q) !== -1;
    });
  }

  function renderChips() {
    var counts = {};
    state.all.forEach(function (a) { counts[a.source] = (counts[a.source] || 0) + 1; });
    var names = ['Tất cả'].concat(Object.keys(counts));
    var box = $('chips');
    box.innerHTML = '';
    names.forEach(function (name) {
      var b = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(name === state.source) }, name);
      b.appendChild(el('span', { class: 'n' }, String(name === 'Tất cả' ? state.all.length : counts[name])));
      b.addEventListener('click', function () { state.source = name; state.shown = PAGE; renderChips(); renderList(); });
      box.appendChild(b);
    });
  }

  function renderList() {
    var items = filtered();
    var list = $('list');
    list.innerHTML = '';
    if (!items.length) {
      list.appendChild(el('div', { class: 'status' }, 'Không có tin nào phù hợp.'));
      return;
    }
    items.slice(0, state.shown).forEach(function (a) {
      var art = el('article', { class: 'item' + (a.image ? '' : ' noimg') });
      var body = el('div');
      var meta = el('div', { class: 'meta' });
      meta.appendChild(el('span', { class: 'src ' + slug(a.source) }, a.source));
      meta.appendChild(el('span', { title: hhmm(a.published) }, '· ' + ago(a.published)));
      body.appendChild(meta);
      var h = el('h2');
      h.appendChild(el('a', { href: a.link, target: '_blank', rel: 'noopener noreferrer' }, a.title));
      body.appendChild(h);
      if (a.summary) body.appendChild(el('p', null, a.summary));
      art.appendChild(body);
      if (a.image) {
        var t = el('a', { class: 'thumb', href: a.link, target: '_blank', rel: 'noopener noreferrer', tabindex: '-1', 'aria-hidden': 'true' });
        var img = el('img', { src: a.image, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
        img.addEventListener('error', function () { t.remove(); art.classList.add('noimg'); });
        t.appendChild(img);
        art.appendChild(t);
      }
      list.appendChild(art);
    });
    if (items.length > state.shown) {
      var more = el('button', { class: 'more', type: 'button' }, 'Xem thêm (' + (items.length - state.shown) + ' tin)');
      more.addEventListener('click', function () { state.shown += PAGE; renderList(); });
      list.appendChild(more);
    }
  }

  var timer;
  $('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = e.target.value; state.shown = PAGE; renderList(); }, 150);
  });

  fetch('news.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      state.all = (data.articles || []).map(function (a) {
        a._f = fold(a.title + ' ' + (a.summary || ''));
        return a;
      });
      $('updated').textContent = 'Cập nhật ' + ago(data.updated) + ' (' + hhmm(data.updated) + ') · ' + state.all.length + ' tin trong 24 giờ';
      renderChips();
      renderList();
    })
    .catch(function () {
      $('updated').textContent = '';
      $('list').innerHTML = '';
      $('list').appendChild(el('div', { class: 'status' }, 'Không tải được news.json. Hãy kiểm tra file đã có trong kho GitHub chưa.'));
    });
})();
</script>
</body>
</html>
